name: Build and publish .NET app

on:
  push:
    branches:
      - develop
      #- test
      - master
      - 'feature/**'
    paths-ignore:
      - 'README.md'
      - '.vscode/*'
      - 'scripts/*'
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  pull-requests: write
  actions: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  AZURE_WEBAPP_PACKAGE_PATH: './artifacts.zip'
  ARTIFACTS_DIRECTORY: './artifacts/'
  WEB_PROJECT: './src/Jalles.Web/Jalles.Web.csproj'
  WWWROOT_DIRECTORY: './src/Jalles.Web/wwwroot/'
  FRONTEND_DIRECTORY: './src/Jalles.Frontend/'
  BACKOFFICE_DIRECTORY: './src/Jalles.BackofficeExtensions/Client/'
  BACKOFFICE_WWWROOT_DIRECTORY: './src/Jalles.BackofficeExtensions/wwwroot/'

jobs:
  frontend-test:
    name: 🖌️ Frontend tests
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set GIT to use CRLF
        run: |
          git config --global core.autocrlf true
          git config --global core.eol crlf

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false

      - name: Run Yarn
        run: yarn --immutable --immutable-cache
        working-directory: ${{ env.FRONTEND_DIRECTORY }}

      - name: Run frontend linting
        run: |
          yarn lint:js
          yarn lint:css
        working-directory: ${{ env.FRONTEND_DIRECTORY }}

  backoffice-test:
    name: 🧪 Backoffice QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true

      - name: Restore node packages
        run: npm ci
        working-directory: ${{ env.BACKOFFICE_DIRECTORY }}

      - name: Run backoffice linting
        run: npm run lint
        working-directory: ${{ env.BACKOFFICE_DIRECTORY }}

      - name: Run backoffice tests
        run: npm run test
        working-directory: ${{ env.BACKOFFICE_DIRECTORY }}

  net-test:
    name: "⚗️ .NET tests"
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore --verbosity minimal

      - name: Run .NET tests
        run: dotnet test --configuration Release

  frontend-build:
    name: 🎨 Frontend build
    runs-on: ubuntu-latest
    needs: [ frontend-test ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          package-manager-cache: false

      - name: Run Yarn
        run: yarn --immutable --immutable-cache
        working-directory: ${{ env.FRONTEND_DIRECTORY }}

      - name: Build Frontend
        run: yarn build
        working-directory: ${{ env.FRONTEND_DIRECTORY }}

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-artifacts
          path: ${{ env.WWWROOT_DIRECTORY }}
          include-hidden-files: true
          if-no-files-found: error

  backoffice-build:
    name: 🎨 Backoffice Build
    runs-on: ubuntu-latest
    needs: backoffice-test
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set node version
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true

      - name: Install node packages
        run: npm ci
        working-directory: ${{ env.BACKOFFICE_DIRECTORY }}

      - name: Build backoffice
        run: npm run build
        working-directory: ${{ env.BACKOFFICE_DIRECTORY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backoffice-artifacts
          path: ${{ env.BACKOFFICE_WWWROOT_DIRECTORY }}
          include-hidden-files: true

  net-build:
    name: 🏡 .NET Build
    runs-on: ubuntu-latest
    needs: [ frontend-build, backoffice-build, net-test ]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up .NETs
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: .NET Restore
        run: dotnet restore

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-artifacts
          path: ${{ env.WWWROOT_DIRECTORY }}

      - name: Download backoffice artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: backoffice-artifacts
          path: ${{ env.BACKOFFICE_WWWROOT_DIRECTORY }}

      - name: dotnet publish
        run: dotnet publish -c Release --runtime linux-x64 --self-contained -o ./artifacts ./src/Jalles.Web/Jalles.Web.csproj

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: ../artifacts.zip
          directory: ./artifacts/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-artifacts
          path: ./artifacts.zip
          if-no-files-found: error


  # deploy-test:
  #   name: 🚀 Deploy to Test
  #   needs: [ net-build ]
  #   if: startsWith(github.ref, 'refs/heads/test')

  #   concurrency:
  #     group: ${{ github.workflow }}-${{ github.ref }}

  #   uses: ./.github/workflows/deploy-to-environment.yml
  #   secrets: inherit
  #   with:
  #     environment: Test
  #     app-name: jalles-tc-public-web-test
  #     url: https://jalles-tc-public-web-test.azurewebsites.net/

  deploy-production:
    name: 🚀 Deploy to Production
    needs: [ net-build ]
    if: github.ref == 'refs/heads/master'

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    uses: ./.github/workflows/deploy-to-environment.yml
    secrets: inherit
    with:
      environment: Production
      app-name: jalles-tc-public-web
      url: https://www.jallestc.se/

  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [ deploy-production ] # deploy-test
    if: always()
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            dotnet-artifacts
            frontend-artifacts
            backoffice-artifacts
