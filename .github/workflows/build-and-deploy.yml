name: Build and deploy ASP.Net Core app to Azure Web App - jalles-tc-public-web

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_WEBAPP_MASTER: jalles-tc-public-web
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  FRONTEND_DIRECTORY: './Jalles.Web/'
  WWWROOT_DIRECTORY: './Jalles.Web/wwwroot/'

on:
  push:
    branches:
      - master
      - develop

    paths-ignore:
      - 'README.md'
      - '.vscode/*'

  workflow_dispatch:

jobs:

  frontend-build:
    name: 🧱 Frontend Build
    runs-on: ubuntu-latest
    # needs: [ frontend-test ]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set node version
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install node packages
        run: npm install
        working-directory: ${{ env.FRONTEND_DIRECTORY }}

      - name: Build frontend
        run: npm run build
        working-directory: ${{ env.FRONTEND_DIRECTORY }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-artifacts
          path: ${{ env.WWWROOT_DIRECTORY }}

  build:
    name: 🏡 .NET Build
    runs-on: ubuntu-latest
    needs: [ frontend-build ]

    steps:
      - name: Checkout Repo yaaas
        uses: actions/checkout@v2

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.x'

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Download frontend artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-artifacts
          path: ${{ env.WWWROOT_DIRECTORY }}

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v2
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    name: 🚀 Deploy to Production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v2
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'jalles-tc-public-web'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5AF64824489B412B970D8714690514EE }}
          package: .

  #cleanup:
  #    name: 🧹 Cleanup
  #    runs-on: ubuntu-latest
  #    needs: [ deploy ]
  #    if: always()
  
  #    steps:
  #    - uses: geekyeggo/delete-artifact@v2
  #      with:
  #          name: |
  #              frontend-artifacts
  #              .net-app