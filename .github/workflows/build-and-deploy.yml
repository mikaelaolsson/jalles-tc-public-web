name: Build and deploy ASP.Net Core app to Azure Web App - jalles-tc-public-web

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_WEBAPP_MASTER: jalles-tc-public-web
  AZURE_WEBAPP_PACKAGE_PATH: './artifacts.zip'
  WWWROOT_DIRECTORY: './Jalles.Web/wwwroot/'

on:
  push:
    branches:
      - master
      #- develop

    paths-ignore:
      - 'README.md'
      - '.vscode/*'

  workflow_dispatch:

permissions:
  checks: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  build:
    name: 🏡 .NET Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo yaaas
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: .NET Restore
        run: dotnet restore

      - name: dotnet publish
        run: dotnet publish -c Release -o ./artifacts ./Jalles.Web/Jalles.Web.csproj

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: ../artifacts.zip # This path is relative to the directory where the artifact is stored
          directory: ./artifacts/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-artifacts
          path: ./artifacts.zip
          if-no-files-found: error

  deploy:
    name: 🚀 Deploy to Production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-artifacts
          path: ./

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_MASTER }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5AF64824489B412B970D8714690514EE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  cleanup:
      name: 🧹 Cleanup
      runs-on: ubuntu-latest
      needs: [ deploy ]
      if: always()

      steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            name: |
                dotnet-artifacts