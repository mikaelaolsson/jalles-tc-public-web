<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Jalles TC - Opsie!</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 2rem 1.25rem;
            background-color: #F4F2E2;
            font-family: 'DM Sans', 'Trebuchet MS', sans-serif, verdana, tahoma;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            max-width: 950px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2.25rem;
            font-weight: 400;
        }

        p {
            font-size: 1.125rem;
        }

        .boot-failed-cta a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;

            padding: 1rem 2rem;

            background-color: #1A1F12;
            color: #F4F2E2;

            border: 1px solid transparent;
            border-radius: 1rem;
            text-decoration: none;
            transition: background-color 0.4s ease-in-out, color 0.4s ease-in-out, border 0.4s ease-in-out;
        }

        .boot-failed-cta a:hover {
            background-color: transparent;
            color: #1A1F12;
            border-color: #1A1F12;
        }

        .boot-failed-cta a:hover img {
            filter: brightness(0);
        }

        .boot-failed-cta img {
            height: 1.5rem;
            transition: filter 0.4s ease-in-out;
        }

        main > img {
            height: 15rem;
        }

        @media only screen and (min-width: 1200px) {
            body {
                padding: 3rem 5rem;
            }

            h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Sidan fungerar inte som förväntat, <br />kom tillbaka snart!</h1>
        <p>Vi är medvetna om felet och arbetar för att åtgärda det. Under tiden kan du försöka ladda om sidan eller vänta några minuter och försöka igen.</p>

        <div class="boot-failed-cta">
            <a href="https://www.facebook.com/JallesTC/"><img src="/static/images/facebook.svg" alt="Facebook">Här hittar du oss på Facebook!</a>
        </div>

        <img src="/static/images/jalles-logo-reverse.svg" alt="Jalles TC Logo">
    </main>
</body>

</html>
